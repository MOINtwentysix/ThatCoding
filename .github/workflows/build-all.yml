name: Build All Platforms

on:
  workflow_dispatch:
    inputs:
      create_release:
        description: "GitHub Release mit den Binaries erstellen"
        type: boolean
        default: false
      tag_name:
        description: "Release-Tag (z. B. v2.2.0-tc)"
        type: string
        default: "v2.2.0-thatcoding"

permissions:
  contents: write

jobs:
  build:
    name: Build All Targets
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Install dependencies
        run: bun install

      - name: Prepare models catalog
        run: |
          mkdir -p .cache/models-catalog
          bun packages/core/script/update-models-snapshot.ts .cache/models-catalog/api.json

      - name: Build for all operating systems
        working-directory: packages/cli
        run: bun run build && rm -rf dist/.bun
        env:
          BUN_COMPILE_RELEASE: bun-v1.4.4
          OPENCODE_MODELS_SNAPSHOT: ${{ github.workspace }}/.cache/models-catalog/api.json
          GH_TOKEN: ${{ github.token }}

      - name: Inspect build output
        run: |
          echo "=== Built directories in packages/cli/dist: ==="
          ls -la packages/cli/dist

      - name: Package binaries into archives
        run: |
          mkdir -p dist-archives
          mkdir -p dist-windows
          mkdir -p dist-linux
          mkdir -p dist-macos

          # ----------------- Windows x64 -----------------
          if [ -f packages/cli/dist/cli-windows-x64/bin/opencode.exe ]; then
            echo "Packaging Windows x64..."
            cp packages/cli/dist/cli-windows-x64/bin/opencode.exe dist-archives/thatcoding-windows-x64.exe
            cp packages/cli/dist/cli-windows-x64/bin/opencode.exe dist-windows/thatcoding.exe
            (cd dist-windows && zip -j ../dist-archives/thatcoding-windows-x64.zip thatcoding.exe)
            rm -f dist-windows/thatcoding.exe
          else
            echo "WARNING: packages/cli/dist/cli-windows-x64/bin/opencode.exe not found!"
          fi

          # ----------------- Windows ARM64 -----------------
          if [ -f packages/cli/dist/cli-windows-arm64/bin/opencode.exe ]; then
            echo "Packaging Windows ARM64..."
            cp packages/cli/dist/cli-windows-arm64/bin/opencode.exe dist-archives/thatcoding-windows-arm64.exe
            cp packages/cli/dist/cli-windows-arm64/bin/opencode.exe dist-windows/thatcoding.exe
            (cd dist-windows && zip -j ../dist-archives/thatcoding-windows-arm64.zip thatcoding.exe)
            rm -f dist-windows/thatcoding.exe
          else
            echo "WARNING: packages/cli/dist/cli-windows-arm64/bin/opencode.exe not found!"
          fi

          # ----------------- Linux x64 -----------------
          if [ -f packages/cli/dist/cli-linux-x64/bin/opencode ]; then
            echo "Packaging Linux x64..."
            cp packages/cli/dist/cli-linux-x64/bin/opencode dist-linux/thatcoding
            chmod +x dist-linux/thatcoding
            tar -czvf dist-archives/thatcoding-linux-x64.tar.gz -C dist-linux thatcoding
            rm -f dist-linux/thatcoding
          fi

          # ----------------- Linux ARM64 -----------------
          if [ -f packages/cli/dist/cli-linux-arm64/bin/opencode ]; then
            echo "Packaging Linux ARM64..."
            cp packages/cli/dist/cli-linux-arm64/bin/opencode dist-linux/thatcoding
            chmod +x dist-linux/thatcoding
            tar -czvf dist-archives/thatcoding-linux-arm64.tar.gz -C dist-linux thatcoding
            rm -f dist-linux/thatcoding
          fi

          # ----------------- macOS ARM64 (Apple Silicon) -----------------
          if [ -f packages/cli/dist/cli-darwin-arm64/bin/opencode ]; then
            echo "Packaging macOS ARM64..."
            cp packages/cli/dist/cli-darwin-arm64/bin/opencode dist-macos/thatcoding
            chmod +x dist-macos/thatcoding
            tar -czvf dist-archives/thatcoding-macos-arm64.tar.gz -C dist-macos thatcoding
            (cd dist-macos && zip -j ../dist-archives/thatcoding-macos-arm64.zip thatcoding)
            rm -f dist-macos/thatcoding
          fi

          # ----------------- macOS Intel (x64) -----------------
          if [ -f packages/cli/dist/cli-darwin-x64/bin/opencode ]; then
            echo "Packaging macOS x64..."
            cp packages/cli/dist/cli-darwin-x64/bin/opencode dist-macos/thatcoding
            chmod +x dist-macos/thatcoding
            tar -czvf dist-archives/thatcoding-macos-x64.tar.gz -C dist-macos thatcoding
            (cd dist-macos && zip -j ../dist-archives/thatcoding-macos-x64.zip thatcoding)
            rm -f dist-macos/thatcoding
          fi

          echo "=== Finished packaging: ==="
          ls -la dist-archives

      - name: Upload Windows x64 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: thatcoding-windows-x64
          path: |
            dist-archives/thatcoding-windows-x64.exe
            dist-archives/thatcoding-windows-x64.zip
          if-no-files-found: warn

      - name: Upload All Release Archives
        uses: actions/upload-artifact@v4
        with:
          name: thatcoding-all-platforms
          path: dist-archives/*

      - name: Create GitHub Release
        if: ${{ inputs.create_release == true }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag_name }}
          name: ${{ inputs.tag_name }}
          draft: false
          prerelease: false
          files: dist-archives/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
